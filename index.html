    <meta name="description" content="سامانه هوشمند و مدرن عمده‌فروشی سیگار، تنباکو و تجهیزات دخانیات با قابلیت استعلام لحظه‌ای و اتصال به API" />

  <body class="bg-slate-50 text-slate-900 font-['Samim','Vazirmatn',sans-serif] antialiased selection:bg-amber-500 selection:text-white">

    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('Service Worker Registered!'))
            .catch(err => console.log('Service Worker Registration failed:', err));
        });
      }
    </script>
