    <meta name="description" content="سامانه جامع پخش و بنکداری عمده دخانیات سوین با کاتالوگ انواع سیگار اورجینال، دستگاه‌های آیکاس و تیریا، ویپ و پاد، لیست قیمت لحظه‌ای، صدور پیش‌فاکتور رسمی و رهگیری بارنامه" />
    <meta property="og:title" content="سامانه پخش عمده دخانیات سوین" />
    <meta property="og:description" content="سامانه جامع پخش و بنکداری عمده دخانیات سوین با کاتالوگ انواع سیگار اورجینال، دستگاه‌های آیکاس و تیریا، ویپ و پاد، لیست قیمت لحظه‌ای، صدور پیش‌فاکتور رسمی و رهگیری بارنامه" />

  </head>
  <body class="bg-slate-50 text-slate-900 font-['Samim','Vazirmatn',sans-serif] antialiased selection:bg-amber-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Safe Service Worker Registration & Anti-Stale Auto-Update Engine
      // Enforces strict 'no-cache' policy and versioned cache busting for instant DB sync
      const SW_VERSION = 'v3.5.2';
      const SW_BUILD_TIME = '1725016000'; // Versioned build identifier

      // 1. Proactive Cache Purging: Delete any outdated or legacy caches on page load
      if ('caches' in window) {
        caches.keys().then((keys) => {
          for (const key of keys) {
            if (!key.includes(SW_VERSION)) {
              console.log('[SW-CacheBust] Purging legacy cache:', key);
              caches.delete(key).catch(() => {});
            }
          }
        }).catch(() => {});
      }

      if ('serviceWorker' in navigator) {
        const isDevOrIframe = window.self !== window.top || 
          window.location.hostname.includes('ais-dev-') || 
          window.location.hostname === 'localhost' || 
          window.location.hostname === '127.0.0.1';

        if (isDevOrIframe) {
          // Unregister any lingering service workers in dev/iframe environment to prevent fetch errors & stale caches
          navigator.serviceWorker.getRegistrations().then(registrations => {
            for (const registration of registrations) {
              registration.unregister().catch(() => {});
            }
          }).catch(() => {});
        } else {
          // Register in production/standalone PWA mode with forced 'no-cache' policy
          window.addEventListener('load', () => {
            // Versioned cache-busting query parameter forces browser HTTP stack to bypass intermediate/proxy caches
            const swUrl = `/sw.js?v=${SW_VERSION}&b=${SW_BUILD_TIME}`;

            // Modern W3C updateViaCache: 'none' guarantees browser NEVER serves stale service worker from HTTP cache
            navigator.serviceWorker.register(swUrl, { updateViaCache: 'none' })
              .then(registration => {
                // Store registration for programmatic checks
                window.swRegistration = registration;

                // Function to trigger update check with anti-cache guarantees
                const triggerUpdateCheck = () => {
                  if (registration) {
                    registration.update().catch(() => {});
                  }
                };

                // 1. Check for update immediately on load
                triggerUpdateCheck();

                // 2. High-frequency update check (every 60 seconds) so DB modifications are quickly detected
                setInterval(triggerUpdateCheck, 60 * 1000);

                // 3. Trigger update check when user focuses window or returns to the tab
                window.addEventListener('focus', triggerUpdateCheck);

                // 4. Trigger update check when user switches back to the PWA app
                document.addEventListener('visibilitychange', () => {
                  if (document.visibilityState === 'visible') {
                    triggerUpdateCheck();
                  }
                });

                // 5. Trigger update check when phone/browser reconnects to internet
                window.addEventListener('online', triggerUpdateCheck);

                // 6. Handle installing and waiting workers: force skip-waiting so new data takes over immediately
                const handleWorker = (worker) => {
                  if (!worker) return;
                  worker.addEventListener('statechange', () => {
                    if (worker.state === 'installed' && navigator.serviceWorker.controller) {
                      // Signal worker to immediately take control
                      worker.postMessage({ type: 'SKIP_WAITING' });
                      window.dispatchEvent(new CustomEvent('pwa-update-ready', {
                        detail: { message: 'نسخه جدید و اطلاعات تازه پایگاه داده بارگذاری شد.' }
                      }));
                    }
                  });
                };

                if (registration.waiting) {
                  registration.waiting.postMessage({ type: 'SKIP_WAITING' });
                }

                registration.addEventListener('updatefound', () => {
                  handleWorker(registration.installing);
                });
              })
              .catch(err => {
                console.debug('Service Worker not active in this environment');
              });
          });

          // Reload page when new Service Worker takes control (seamless instant transition to fresh data)
          let refreshing = false;
          navigator.serviceWorker.addEventListener('controllerchange', () => {
            if (!refreshing) {
              refreshing = true;
              window.location.reload();
            }
          });
        }
      }

      // Global utility: Purge all caches and force hard refresh with fresh database content
      window.forceBustAndReload = async function() {
        if ('caches' in window) {
          try {
            const keys = await caches.keys();
            await Promise.all(keys.map(k => caches.delete(k)));
          } catch (e) {}
        }
        if ('serviceWorker' in navigator && window.swRegistration) {
          try {
            await window.swRegistration.update();
          } catch (e) {}
        }
        window.location.reload();
      };

      // Manual update checker function accessible globally
      window.checkForAppUpdates = function() {
        if ('serviceWorker' in navigator && window.swRegistration) {
          return window.swRegistration.update()
            .then(() => {
              console.log('[SW] PWA update check completed with no-cache policy');
              return true;
            })
            .catch(() => false);
        }
        return Promise.resolve(false);
      };

      // Track PWA Installation
      window.addEventListener('appinstalled', () => {
        localStorage.setItem('pwa_installed', 'true');
        window.dispatchEvent(new Event('pwa-installed-change'));
      });
      if (window.matchMedia('(display-mode: standalone)').matches || navigator.standalone) {
        localStorage.setItem('pwa_installed', 'true');
      }
    </script>
  </body>
</html>
