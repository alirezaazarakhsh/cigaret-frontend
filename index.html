<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>پخش عمده دخانیات و سیگار | سامانه سفارشات تجاری</title>
    <meta name="description" content="سامانه هوشمند و مدرن عمده‌فروشی سیگار، تنباکو و تجهیزات دخانیات با قابلیت استعلام لحظه‌ای و اتصال به API" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#2563eb" />
    <link rel="apple-touch-icon" href="/icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="پخش سوین" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/samim-font@v4.0.5/dist/font-face.css" rel="stylesheet" type="text/css" crossorigin="anonymous" />
  </head>
  <body class="bg-slate-50 text-slate-900 font-['Samim','Vazirmatn',sans-serif] antialiased selection:bg-amber-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Safe Service Worker Registration & Auto-Update Engine
      if ('serviceWorker' in navigator) {
        const isDevOrIframe = window.self !== window.top || 
          window.location.hostname.includes('ais-dev-') || 
          window.location.hostname === 'localhost' || 
          window.location.hostname === '127.0.0.1';

        if (isDevOrIframe) {
          // Unregister any lingering service workers in dev/iframe environment to prevent fetch errors & stale caches
          navigator.serviceWorker.getRegistrations().then(registrations => {
            for (const registration of registrations) {
              registration.unregister().catch(() => {});
            }
          }).catch(() => {});
        } else {
          // Register in production/standalone PWA mode
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js')
              .then(registration => {
                // Store registration for programmatic checks
                window.swRegistration = registration;

                // 1. Check for update immediately on load
                registration.update().catch(() => {});

                // 2. Periodic update check (every 15 minutes)
                setInterval(() => {
                  registration.update().catch(() => {});
                }, 15 * 60 * 1000);

                // 3. Check for update when user re-opens / switches back to the PWA app
                document.addEventListener('visibilitychange', () => {
                  if (document.visibilityState === 'visible') {
                    registration.update().catch(() => {});
                  }
                });

                // 4. Check when phone connects to internet
                window.addEventListener('online', () => {
                  registration.update().catch(() => {});
                });

                // 5. Listen for new worker installed / waiting
                registration.addEventListener('updatefound', () => {
                  const newWorker = registration.installing;
                  if (newWorker) {
                    newWorker.addEventListener('statechange', () => {
                      if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                        // Notify React UI that an update is ready
                        window.dispatchEvent(new CustomEvent('pwa-update-ready', {
                          detail: { message: 'نسخه جدید سایت آماده شد و خودکار جایگزین می‌گردد.' }
                        }));
                      }
                    });
                  }
                });
              })
              .catch(err => {
                console.debug('Service Worker not active in this environment');
              });
          });

          // Reload page when new Service Worker takes control (seamless update)
          let refreshing = false;
          navigator.serviceWorker.addEventListener('controllerchange', () => {
            if (!refreshing) {
              refreshing = true;
              window.location.reload();
            }
          });
        }
      }

      // Manual update checker function accessible globally
      window.checkForAppUpdates = function() {
        if ('serviceWorker' in navigator && window.swRegistration) {
          return window.swRegistration.update()
            .then(() => {
              console.log('PWA update check completed');
              return true;
            })
            .catch(() => false);
        }
        return Promise.resolve(false);
      };

      // Track PWA Installation
      window.addEventListener('appinstalled', () => {
        localStorage.setItem('pwa_installed', 'true');
        window.dispatchEvent(new Event('pwa-installed-change'));
      });
      if (window.matchMedia('(display-mode: standalone)').matches || navigator.standalone) {
        localStorage.setItem('pwa_installed', 'true');
      }
    </script>
  </body>
</html>
