version: '3.8'

services:
  sevin-frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sevin_react_frontend
    restart: always
    ports:
      - "80:80"
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
